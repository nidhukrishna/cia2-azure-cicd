apiVersion: apps/v1
kind: Deployment
metadata:
  name: cia2-webapp
  labels:
    app: cia2-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cia2-webapp
  template:
    metadata:
      labels:
        app: cia2-webapp
    spec:
      containers:
      - name: cia2-webapp
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
