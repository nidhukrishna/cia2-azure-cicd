name: Azure End-to-End CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  RG_NAME: cia2-devops-rg
  AKS_NAME: cia2-aks-cluster
  IMAGE_NAME: cia2-webapp

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 2. Compile and Package via Maven
        run: mvn clean compile package -DskipTests

      - name: 3. Run Unit Tests
        run: mvn test

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: 4. Build and Tag Docker Image
        run: |
          export FULL_IMAGE="${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "FULL_IMAGE_NAME=$FULL_IMAGE" >> $GITHUB_ENV
          docker build -t $FULL_IMAGE .

      - name: 5. Push Image to ACR
        run: docker push $FULL_IMAGE_NAME

      - name: Get AKS Kubeconfig Credentials
        run: az aks get-credentials --resource-group ${{ env.RG_NAME }} --name ${{ env.AKS_NAME }} --overwrite-existing

      - name: 6. Run Ansible Playbook to Deploy to AKS
        run: |
          sudo apt-get update && sudo apt-get install -y ansible
          cd ansible
          ansible-playbook -i inventory.ini deploy-playbook.yml

      - name: 7. Verify Kubernetes Pods and External IP
        run: |
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get service cia2-webapp-service
